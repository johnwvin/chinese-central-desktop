[package]
name = "chinese-central-desktop"
version = "0.1.0"
description = "Chinese Central desktop window"
authors = ["Chinese Central"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
tauri = { version = "=2.11.6", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices"] }
webview2-com = "=0.38.2"
